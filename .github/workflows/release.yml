name: Changesets release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - name: Set up Python for font tooling
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install latest Font Splitter
        run: python -m pip install --requirement requirements-fonts.txt
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Version or publish
        id: changesets
        if: env.NPM_TOKEN != ''
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release:publish
          title: 'chore: release packages'
          commit: 'chore: release packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify jsDelivr package delivery
        if: steps.changesets.outputs.published == 'true'
        run: |
          version="$(node -p "require('./packages/core/package.json').version")"
          css_url="https://cdn.jsdelivr.net/npm/@vp-tw/taipei-sans-tc@$version/dist/Regular/TaipeiSansTCBeta-Regular.css"

          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --head "$css_url"; then
              exit 0
            fi

            sleep 15
          done

          echo "jsDelivr did not serve $css_url after 180 seconds." >&2
          exit 1
