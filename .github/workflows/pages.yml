name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - name: Set up Python for font tooling
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install latest Font Splitter
        run: python -m pip install --requirement requirements-fonts.txt
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Build site and font package
        run: pnpm build
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/doc/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
